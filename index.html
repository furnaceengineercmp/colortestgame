<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Color Test — Uji Ingatan Warna</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b16;--panel:rgba(18,26,48,.75);--line:rgba(0,229,255,.35);--tx:#e6f1ff;--mut:#8aa0c4;--ac:#00e5ff;--ac2:#ff2bd6;--grid:rgba(0,229,255,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#eef3fb;--panel:rgba(255,255,255,.85);--line:rgba(0,110,200,.35);--tx:#0e1a33;--mut:#51648a;--ac:#0077d6;--ac2:#c2189f;--grid:rgba(0,90,200,.08)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:'Rajdhani',system-ui,sans-serif;font-size:18px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:36px 36px;transition:background .3s}
h1,h2,.orb{font-family:'Orbitron',system-ui,sans-serif;letter-spacing:.06em}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:20px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;backdrop-filter:blur(8px);box-shadow:0 0 28px -10px var(--ac);animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
button{font-family:'Orbitron',sans-serif;font-weight:700;font-size:14px;letter-spacing:.06em;cursor:pointer;color:var(--tx);background:transparent;border:1px solid var(--ac);border-radius:10px;padding:12px 18px;transition:.2s}
button:hover{background:var(--ac);color:#001018;box-shadow:0 0 18px var(--ac)}
button.pri{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border:0}
button.pri:hover{filter:brightness(1.15);box-shadow:0 0 22px var(--ac2)}
button.sm{padding:7px 12px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{display:block;color:var(--mut);margin:14px 0 6px}
input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--tx);font:inherit;font-size:20px}
.val{font-family:'Orbitron',sans-serif;color:var(--ac);float:right}
.set input[type=range]{width:100%;accent-color:var(--ac)}
.hide{display:none!important}
#vMem,#vAns,#vRes{box-shadow:none;backdrop-filter:none}
.big{height:min(34vh,260px);border-radius:16px;border:2px solid var(--mut);box-shadow:none;transition:background .05s}
.big.memo{height:min(48vh,380px)}
.bar{height:6px;border-radius:6px;background:var(--grid);margin:12px 0;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--mut)}
.hud{display:flex;justify-content:space-between;font-family:'Orbitron',sans-serif;font-size:13px;color:var(--mut)}
.hud b{color:var(--ac)}
.sl{margin:16px 0 4px}
.sl small{color:var(--mut)}
.sl input{-webkit-appearance:none;appearance:none;width:100%;height:30px;border-radius:15px;border:1px solid var(--line);outline:none;display:block;margin-top:4px}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:#fff;border:3px solid #111;box-shadow:none}
.sl input::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid #111}
#sH{background:linear-gradient(90deg,red,#ff0,#0f0,#0ff,#00f,#f0f,red)}
#sV{background:linear-gradient(90deg,var(--c1),#000);direction:rtl}
#sW{background:linear-gradient(90deg,var(--c1),#fff)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.cmp div{border-radius:14px;padding:12px;border:1px solid var(--line);text-align:center}
.cmp .sw{height:120px;border-radius:10px;margin-bottom:8px;border:1px solid #fff3}
.cmp b{display:block;font-family:'Orbitron',sans-serif;font-size:14px}
.cmp span{color:var(--mut);font-size:15px}
.score{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(40px,12vw,72px);text-align:center;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .5s}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.chips span{border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-family:'Orbitron',sans-serif;font-size:12px}
table{width:100%;border-collapse:collapse;margin-top:8px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:500}
.cnt{font-family:'Orbitron',sans-serif;font-weight:900;font-size:56px;text-align:center;color:var(--ac);text-shadow:0 0 20px var(--ac)}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><div class="logo">COLOR//TEST</div>
  <div class="row"><button class="sm" id="bLb">PERINGKAT</button><button class="sm hide" id="bNew">GAME BARU</button><button class="sm" id="bLg">EN</button><button class="sm" id="bTh">☾ / ☀</button></div></div>

 <section id="vSet" class="card set">
  <h2 style="margin-top:0">Pengaturan</h2>
  <label>Waktu mengingat warna <span class="val" id="oM">3 dtk</span></label><input type="range" id="iM" min="1" max="15" value="3">
  <label>Waktu menjawab <span class="val" id="oA">20 dtk</span></label><input type="range" id="iA" min="5" max="60" value="20">
  <label>Jumlah tebakan per permainan <span class="val" id="oR">5</span></label><input type="range" id="iR" min="1" max="15" value="5">
  <label>Nama pemain</label><input type="text" id="iN" maxlength="16" placeholder="Masukkan nama…">
  <div class="row" style="margin-top:20px"><button class="pri" id="bStart">MULAI PERMAINAN</button></div>
 </section>

 <section id="vMem" class="card hide">
  <div class="hud"><span>TEBAKAN <b id="mR"></b></span><span>INGAT WARNA INI! <b id="mT"></b></span></div>
  <div class="bar"><i id="mB"></i></div><div class="big memo" id="mBox"></div>
 </section>

 <section id="vAns" class="card hide">
  <div class="hud"><span>TEBAKAN <b id="aR"></b></span><span>SISA <b id="aT"></b></span></div>
  <div class="bar"><i id="aB"></i></div>
  <div class="big" id="gBox"></div>
  <div class="sl"><small>① WARNA (HUE)</small><input type="range" id="sH" min="0" max="360" value="0"></div>
  <div class="sl"><small>② GELAP ◀ ▶ NORMAL</small><input type="range" id="sV" min="0" max="100" value="100"></div>
  <div class="sl"><small>③ TERANG (PUDAR KE PUTIH)</small><input type="range" id="sW" min="0" max="100" value="0"></div>
  <div class="row" style="margin-top:18px"><button class="pri" id="bLock">KUNCI JAWABAN</button></div>
 </section>

 <section id="vRes" class="card hide">
  <div class="hud"><span>HASIL TEBAKAN <b id="rR"></b></span></div>
  <div class="score" id="rS"></div>
  <div class="cmp"><div><div class="sw" id="rTs"></div><b>WARNA ASLI</b><span id="rTn"></span></div><div><div class="sw" id="rGs"></div><b>TEBAKANMU</b><span id="rGn"></span></div></div>
  <div class="row" style="justify-content:center"><button class="pri" id="bNext">LANJUT</button></div>
 </section>

 <section id="vEnd" class="card hide">
  <h2 style="margin-top:0;text-align:center">Permainan Selesai</h2>
  <p style="text-align:center;margin:0" id="eN"></p>
  <div class="score" id="eS"></div><p style="text-align:center;margin:0;color:var(--mut)">RATA-RATA SKOR</p>
  <div class="chips" id="eC"></div>
  <label>Pemain selanjutnya</label><input type="text" id="eIn" maxlength="16" placeholder="Nama pemain berikutnya…">
  <div class="row" style="margin-top:16px"><button class="pri" id="bAgain">MAIN LAGI (PEMAIN SELANJUTNYA)</button><button id="bReset">MULAI DARI AWAL</button></div>
 </section>

 <section id="vLb" class="card hide">
  <h2 style="margin-top:0">Peringkat</h2>
  <table><thead><tr><th>#</th><th>Nama</th><th>Rata-rata</th><th>Tebakan</th></tr></thead><tbody id="lbB"></tbody></table>
  <div class="row" style="margin-top:16px"><button id="bBack">KEMBALI</button><button class="sm" id="bClr">HAPUS PERINGKAT</button></div>
 </section>
</div>
<script>
const $=id=>document.getElementById(id);
const views=['vSet','vMem','vAns','vRes','vEnd','vLb'];
let cfg={m:3,a:20,r:5},name='',round=0,scores=[],target,tmr,prevView='vSet',lb=[];
try{lb=JSON.parse(localStorage.getItem('ct_lb')||'[]')}catch(e){}
function save(){try{localStorage.setItem('ct_lb',JSON.stringify(lb))}catch(e){}}
function show(v){views.forEach(x=>$(x).classList.toggle('hide',x!==v));$('bNew').classList.toggle('hide',!['vMem','vAns','vRes'].includes(v));if(v!=='vLb')prevView=v}
// theme
const root=document.documentElement;
root.dataset.theme=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
$('bTh').onclick=()=>root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';
// settings
let lang=(()=>{try{const s=localStorage.getItem('ct_lang');if(s)return s}catch(e){}return(navigator.language||'id').startsWith('id')?'id':'en'})();
const ID=()=>lang==='id',PL=()=>ID()?'Pemain':'Player',U=()=>ID()?' dtk':' s';
const DICT={'PERINGKAT':'LEADERBOARD','GAME BARU':'NEW GAME','Pengaturan':'Settings','Waktu mengingat warna':'Memorize time','Waktu menjawab':'Answer time','Jumlah tebakan per permainan':'Guesses per game','Nama pemain':'Player name','MULAI PERMAINAN':'START GAME','TEBAKAN':'GUESS','INGAT WARNA INI!':'MEMORIZE THIS COLOR!','SISA':'LEFT','① WARNA (HUE)':'① COLOR (HUE)','② GELAP ◀ ▶ NORMAL':'② DARK ◀ ▶ NORMAL','③ TERANG (PUDAR KE PUTIH)':'③ LIGHT (FADE TO WHITE)','KUNCI JAWABAN':'LOCK ANSWER','HASIL TEBAKAN':'GUESS RESULT','WARNA ASLI':'ORIGINAL COLOR','TEBAKANMU':'YOUR GUESS','Permainan Selesai':'Game Over','RATA-RATA SKOR':'AVERAGE SCORE','Pemain selanjutnya':'Next player','MAIN LAGI (PEMAIN SELANJUTNYA)':'PLAY AGAIN (NEXT PLAYER)','MULAI DARI AWAL':'RESTART','Peringkat':'Leaderboard','Nama':'Name','Rata-rata':'Average','Tebakan':'Guesses','KEMBALI':'BACK','HAPUS PERINGKAT':'CLEAR LEADERBOARD'};
const CN={Hitam:'Black',Putih:'White','Abu-abu Gelap':'Dark Gray','Abu-abu Terang':'Light Gray','Abu-abu':'Gray',Merah:'Red',Oranye:'Orange',Kuning:'Yellow','Hijau Lime':'Lime',Hijau:'Green','Hijau Toska':'Teal',Cyan:'Cyan','Biru Langit':'Sky Blue',Biru:'Blue',Ungu:'Purple',Magenta:'Magenta',Pink:'Pink',Cokelat:'Brown','Merah Muda':'Light Red'};
function cn(s){if(ID())return s;let p='';if(/ Tua$/.test(s)){p='Dark ';s=s.replace(/ Tua$/,'')}if(/ Pastel$/.test(s)){p+='Pastel ';s=s.replace(/ Pastel$/,'')}return p+(CN[s]||s)}
let lastRes=null;
function showNames(){if(lastRes){$('rTn').textContent=cn(lastRes[0]);$('rGn').textContent=cn(lastRes[1])}}
function setNext(){$('bNext').textContent=round>=cfg.r?(ID()?'LIHAT HASIL AKHIR':'SEE FINAL RESULT'):(ID()?'TEBAKAN BERIKUTNYA':'NEXT GUESS')}
function updVals(){$('oM').textContent=$('iM').value+U();$('oA').textContent=$('iA').value+U();$('oR').textContent=$('iR').value}
['iM','iA','iR'].forEach(i=>$(i).oninput=updVals);
const TN=[];{const w=document.createTreeWalker(document.querySelector('.wrap'),NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const k=n.nodeValue.trim();if(DICT[k]&&!n.parentElement.closest('.val'))TN.push([n,k,n.nodeValue])}}
function applyLang(){document.documentElement.lang=lang;TN.forEach(([n,k,o])=>{n.nodeValue=ID()?o:o.replace(k,DICT[k])});
 $('iN').placeholder=ID()?'Masukkan nama…':'Enter name…';$('eIn').placeholder=ID()?'Nama pemain berikutnya…':'Next player name…';
 $('bLg').textContent=ID()?'EN':'ID';updVals();showNames();setNext();document.title=ID()?'Color Test — Uji Ingatan Warna':'Color Test — Color Memory Challenge'}
$('bLg').onclick=()=>{lang=ID()?'en':'id';try{localStorage.setItem('ct_lang',lang)}catch(e){}applyLang()};
// color math
function hsv2rgb(h,s,v){const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};return[f(5)*255,f(3)*255,f(1)*255]}
function rgb2lab(c){let[r,g,b]=c.map(x=>{x/=255;return x>.04045?Math.pow((x+.055)/1.055,2.4):x/12.92});
 let X=(r*.4124+g*.3576+b*.1805)/.95047,Y=r*.2126+g*.7152+b*.0722,Z=(r*.0193+g*.1192+b*.9505)/1.08883;
 const f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;return[116*f(Y)-16,500*(f(X)-f(Y)),200*(f(Y)-f(Z))]}
const css=c=>`rgb(${c.map(Math.round).join(',')})`;
const dE=(a,b)=>Math.hypot(...a.map((x,i)=>x-b[i]));
function nameOf(h,s,v){
 if(v<.14)return'Hitam';
 if(s<.08)return v>.92?'Putih':v<.4?'Abu-abu Gelap':v>.75?'Abu-abu Terang':'Abu-abu';
 const n=[[15,'Merah'],[40,'Oranye'],[65,'Kuning'],[95,'Hijau Lime'],[150,'Hijau'],[175,'Hijau Toska'],[200,'Cyan'],[225,'Biru Langit'],[255,'Biru'],[280,'Ungu'],[310,'Magenta'],[340,'Pink'],[361,'Merah']];
 let base=n.find(x=>h<x[0])[1];
 if(base==='Oranye'&&v<.6&&s>.4)base='Cokelat';
 if(base==='Merah'&&s<.5&&v>.7)base='Merah Muda';
 return base+(v<.45?' Tua':'')+(s<.45&&base!=='Merah Muda'?' Pastel':'');
}
const cur=()=>({h:+$('sH').value,v:+$('sV').value/100,s:1-$('sW').value/100});
function paint(){const c=cur();$('gBox').style.background=css(hsv2rgb(c.h,c.s,c.v));$('gBox').style.color=css(hsv2rgb(c.h,c.s,c.v));
 const base=css(hsv2rgb(c.h,1,1));$('sV').style.setProperty('--c1',css(hsv2rgb(c.h,c.s,1)));$('sW').style.setProperty('--c1',css(hsv2rgb(c.h,1,c.v)));}
['sH','sV','sW'].forEach(i=>$(i).oninput=paint);
// flow
function countdown(sec,tEl,bEl,done){clearInterval(tmr);const t0=Date.now();
 tmr=setInterval(()=>{const left=Math.max(0,sec-(Date.now()-t0)/1000);tEl.textContent=left.toFixed(1)+'s';bEl.style.width=(left/sec*100)+'%';if(left<=0){clearInterval(tmr);done()}},60)}
$('bStart').onclick=()=>{cfg={m:+$('iM').value,a:+$('iA').value,r:+$('iR').value};name=$('iN').value.trim()||PL();round=0;scores=[];nextRound()};
function nextRound(){round++;
 target={h:Math.random()*360,s:.25+Math.random()*.75,v:.25+Math.random()*.75};
 const c=css(hsv2rgb(target.h,target.s,target.v));
 $('mBox').style.background=c;$('mBox').style.color=c;$('mR').textContent=round+'/'+cfg.r;show('vMem');
 countdown(cfg.m,$('mT'),$('mB'),startAns)}
function startAns(){$('aR').textContent=round+'/'+cfg.r;$('sH').value=0;$('sV').value=100;$('sW').value=0;paint();show('vAns');
 countdown(cfg.a,$('aT'),$('aB'),lock)}
$('bLock').onclick=()=>{clearInterval(tmr);lock()};
function lock(){clearInterval(tmr);const g=cur(),tc=hsv2rgb(target.h,target.s,target.v),gc=hsv2rgb(g.h,g.s,g.v);
 const d=dE(rgb2lab(tc),rgb2lab(gc));const sc=Math.round(10*Math.exp(-d/35)*1000)/1000;scores.push(sc);
 $('rR').textContent=round+'/'+cfg.r;$('rS').textContent=sc.toFixed(3);
 $('rTs').style.background=css(tc);$('rGs').style.background=css(gc);
 lastRes=[nameOf(target.h,target.s,target.v),nameOf(g.h,g.s,g.v)];showNames();
 setNext();show('vRes')}
$('bNext').onclick=()=>round>=cfg.r?finish():nextRound();
function finish(){const avg=scores.reduce((a,b)=>a+b,0)/scores.length;
 lb.push({n:name,s:avg,r:scores.length});lb.sort((a,b)=>b.s-a.s);lb=lb.slice(0,20);save();
 $('eN').textContent=name;$('eS').textContent=avg.toFixed(3);
 $('eC').innerHTML=scores.map((s,i)=>`<span>#${i+1} · ${s.toFixed(3)}</span>`).join('');$('eIn').value='';show('vEnd')}
$('bAgain').onclick=()=>{name=$('eIn').value.trim()||PL();round=0;scores=[];nextRound()};
function toSet(){clearInterval(tmr);show('vSet')}
$('bReset').onclick=toSet;
$('bNew').onclick=()=>{if(confirm(ID()?'Mulai permainan baru? Progres saat ini akan hilang.':'Start a new game? Current progress will be lost.'))toSet()};
$('bLb').onclick=()=>{clearInterval(tmr);$('lbB').innerHTML=lb.length?lb.map((x,i)=>`<tr><td>${i+1}</td><td>${x.n.replace(/[&<>]/g,'')}</td><td class="orb" style="color:var(--ac)">${x.s.toFixed(3)}</td><td>${x.r}</td></tr>`).join(''):'<tr><td colspan="4">'+(ID()?'Belum ada skor.':'No scores yet.')+'</td></tr>';
 show('vLb')};
$('bBack').onclick=()=>{if(['vMem','vAns'].includes(prevView))toSet();else show(prevView)};
$('bClr').onclick=()=>{if(confirm(ID()?'Hapus semua peringkat?':'Clear the whole leaderboard?')){lb=[];save();$('bLb').click()}};
applyLang();
</script>
</body>
</html>
